[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
dirs = "6"
hex = "0.4"
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "chrono", "uuid"] }
windows = { version = "0.52", features = ["Foundation", "Security_Credentials_UI"] }
keyring = "2"
zeroize = { version = "1.5", features = ["alloc"] }
zip = "2"
sha2 = "0.10"
jsonschema = "0.33.0"
tokio = { version = "1.53.1", features = ["full"] }
feed-rs = "2.4.0"
reqwest = { version = "0.13.3", features = ["json", "rustls"] }
chrono = "0.4.45"
base64 = "0.22"

[dev-dependencies]
mockito = "1.7.2"
